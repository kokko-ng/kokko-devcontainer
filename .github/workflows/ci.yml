name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The repo is a cookiecutter template, so most jobs render it first and lint or
# build the OUTPUT. Linting the template payload in place would either fail on
# the Jinja in devcontainer.json and the Dockerfile, or force the Jinja out of
# them; rendering proves both that the template still produces a valid project
# and that the project it produces is clean. Renders land in .rendered/, which
# is gitignored.

jobs:
  pre-commit:
    name: pre-commit (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  settings-merge-tests:
    name: settings pipeline regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Table-tests merge-settings.jq and prune-roster.jq: user hooks and
      # choices preserved, retired git-safety wiring stripped, the
      # acceptEdits -> auto migration, idempotency, and roster pruning.
      # Runs against the template payload directly — the settings pipeline is
      # deliberately Jinja-free. Needs only bash and jq.
      - name: Run settings pipeline tests
        run: bash tests/merge-settings-tests.sh

  template-tests:
    name: template render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Renders several answer sets and asserts the generated tree: features
      # added and dropped, ports and paths threaded through, the plugin roster
      # emptied on request, no unrendered Jinja left, and invalid answers
      # rejected by the pre-generation hook.
      - name: Run template render tests
        run: |
          pip install cookiecutter
          bash tests/template-tests.sh

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned docker form: the linter version is explicit, not whatever a
      # marketplace action resolves to.
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # The bundled scripts carry no Jinja, so they lint in place. Their
      # rendered copies are linted again by tests/template-tests.sh.
      - name: shellcheck
        run: |
          shellcheck --severity=info \
            "{{cookiecutter.project_slug}}/.devcontainer/post-create.sh" \
            "{{cookiecutter.project_slug}}/.devcontainer/init-host-certs.sh" \
            "{{cookiecutter.project_slug}}/.devcontainer/config/claude/hooks/session-provision-status.sh" \
            tests/merge-settings-tests.sh \
            tests/template-tests.sh \
            tests/sandbox-probe.sh

  hadolint:
    name: hadolint (rendered Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Both apt layers the template can emit: with the ODBC driver (the
      # default) and without it.
      - name: Render both Dockerfile variants
        run: |
          pip install cookiecutter
          cookiecutter . --no-input -o .rendered project_name="CI Smoke"
          cookiecutter . --no-input -o .rendered project_name="CI Slim" \
            include_azure_cli=no include_azure_sql_driver=no \
            include_docker_in_docker=no include_copilot_cli=no \
            include_playwright=no claude_plugin_roster=none
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: .rendered/ci-smoke/.devcontainer/Dockerfile
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: .rendered/ci-slim/.devcontainer/Dockerfile

  devcontainer-build:
    name: devcontainer build smoke test
    runs-on: ubuntu-latest
    # devcontainer.json passes this through to containerEnv, so the
    # post-create run inside the build skips the plugin-install network
    # calls that need a signed-in CLI and are doomed in CI anyway.
    env:
      KOKKO_SKIP_PLUGINS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Render the template with default answers
        run: |
          pip install cookiecutter
          cookiecutter . --no-input -o .rendered project_name="CI Smoke"
      # Context for the Bash sandbox check in runCmd below: the runner's
      # AppArmor state is what apparmor=unconfined is there for.
      - name: Report the runner's AppArmor and user-namespace settings
        run: |
          echo "apparmor enabled: $(cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo n/a)"
          sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces || true
      # The runner is Ubuntu 24.04, restricted like Colima's VM. Apply the
      # same setting the documented one-time Colima fix applies, so this
      # container sees what a correctly set-up host gives it. (The
      # sandbox-colima job proves the fix itself, verbatim, on a real VM.)
      - name: Lift the runner's AppArmor user-namespace restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Builds the generated image and runs its postCreateCommand — this is
      # what catches a Dockerfile or post-create.sh regression before a human
      # hits it. Requires .devcontainer/certs/.gitkeep to be committed so the
      # COPY succeeds on a fresh render.
      - uses: devcontainers/ci@v0.3
        with:
          subFolder: .rendered/ci-smoke
          push: never
          runCmd: |
            set -e
            jq --version
            # Baked into the image by the Dockerfile, at the version it pins,
            # and kept there by DISABLE_AUTOUPDATER.
            command -v claude
            pin="$(grep -oE 'bash -s [0-9]+\.[0-9]+\.[0-9]+' .devcontainer/Dockerfile | awk '{print $3}')"
            claude --version | grep -F "$pin"
            test "$DISABLE_AUTOUPDATER" = "1"
            test "$CLAUDE_CONFIG_DIR" = "$HOME/.claude"
            # The image-level tooling the bundled CLAUDE.md and the sandbox rely on.
            command -v pre-commit shellcheck bwrap socat
            # The Bash sandbox can actually START, not just be installed:
            # bubblewrap run the way Claude Code runs it with
            # enableWeakerNestedSandbox. This needs the runArgs seccomp
            # profile, and the runner's AppArmor makes it exercise
            # apparmor=unconfined too. post-create's own probe must agree,
            # and the optional seccomp filter must be where claude looks.
            bwrap --new-session --die-with-parent --ro-bind / / --dev /dev \
                --unshare-user --unshare-net --unshare-pid --bind /proc /proc true
            if grep -q 'bash-sandbox' "$HOME/.devcontainer-provision-status"; then
                echo "post-create recorded the Bash sandbox as broken"; exit 1
            fi
            test -d "$(npm root -g)/@anthropic-ai/sandbox-runtime"
            # The live settings.json the merge produced must be valid, run in
            # Auto permission mode, carry the bundled defaults, wire the
            # SessionStart status hook, and carry none of the retired
            # git-safety hook wiring or files.
            jq -e '.permissions.defaultMode == "auto"' "$HOME/.claude/settings.json"
            jq -e '.env.BASH_DEFAULT_TIMEOUT_MS == "600000"' "$HOME/.claude/settings.json"
            jq -e '.sandbox.enabled == false and .sandbox.enableWeakerNestedSandbox == true' "$HOME/.claude/settings.json"
            jq -e '[.hooks.SessionStart[].hooks[].command] == ["$HOME/.claude/hooks/session-provision-status.sh"]' "$HOME/.claude/settings.json"
            jq -e 'has("skipDangerousModePermissionPrompt") | not' "$HOME/.claude/settings.json"
            jq -e '(tostring | test("guard-git|git-snapshot|session-git-safety")) | not' "$HOME/.claude/settings.json"
            test ! -e "$HOME/.claude/hooks/guard-git.sh"
            if command -v snaps; then echo "retired snaps helper is still on PATH"; exit 1; fi
            # The status hook is installed, silent when nothing failed, and
            # prints the ledger when something did.
            test -x "$HOME/.claude/hooks/session-provision-status.sh"
            test -z "$(DEVCONTAINER_PROVISION_STATUS=/dev/null "$HOME/.claude/hooks/session-provision-status.sh")"
            printf '2026-01-01T00:00:00Z FAILED: example-step\n' > /tmp/ledger
            DEVCONTAINER_PROVISION_STATUS=/tmp/ledger "$HOME/.claude/hooks/session-provision-status.sh" | grep -q 'example-step'
            # Policy lives in managed settings, above anything a user can set.
            jq -e '.permissions.disableBypassPermissionsMode == "disable"' /etc/claude-code/managed-settings.json
            jq -e '.permissions.deny | index("Bash(git push --force*)") != null' /etc/claude-code/managed-settings.json
            # git works in the bind mount and in any worktree under it.
            git config --global --get-all safe.directory | grep -qxF '*'
            # The generated toggles must reach the container environment.
            test "$DEVCONTAINER_FRONTEND_DIR" = "ui"
            # Idempotence smoke: a second --config-only run must succeed.
            KOKKO_SKIP_PLUGINS=1 bash .devcontainer/post-create.sh --config-only

  sandbox-colima:
    name: Bash sandbox on a Colima VM
    # devcontainer-build proves bubblewrap starts on the runner's own kernel.
    # This proves it where developers actually run the container: Colima's VM
    # image, with its own kernel, AppArmor and user-namespace sysctls, booted
    # under KVM on the runner. tests/sandbox-probe.sh runs inside containers
    # on it, as a non-root user: with Docker's defaults the sandbox must be
    # refused (or the probe proves nothing), with the template's two runArgs
    # security options it must work end to end.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned like everything else; bump alongside a Colima upgrade on the
      # hosts. Colima needs Lima >= 0.18.
      COLIMA_VERSION: v0.10.3
      LIMA_VERSION: 2.2.0
      SANDBOX_RUNTIME_VERSION: 0.0.78
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU, Lima and Colima
        run: |
          sudo apt-get update
          # ovmf: the UEFI firmware Lima boots x86_64 guests with.
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local
          curl -fsSLo colima "https://github.com/abiosoft/colima/releases/download/${COLIMA_VERSION}/colima-Linux-x86_64"
          sudo install colima /usr/local/bin/colima
      - name: Start Colima
        run: |
          colima start --runtime docker --cpus 2 --memory 4 --disk 20
          # Every later docker call must reach Colima's daemon, not the
          # runner's. Set only now: the context does not exist before start.
          echo "DOCKER_CONTEXT=colima" >> "$GITHUB_ENV"
      - name: Show Lima's logs if Colima failed to start
        if: failure()
        run: |
          for f in "$HOME"/.config/colima/_lima/colima/*.log; do
            echo "::group::$f"; tail -n 60 "$f"; echo "::endgroup::"
          done
      - name: Report the VM's security settings
        run: |
          colima ssh -- cat /etc/os-release
          colima ssh -- uname -r
          # shellcheck disable=SC2016  # expands inside the VM, not on the runner
          colima ssh -- sh -c 'echo "apparmor enabled: $(cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo n/a)"; sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces 2>&1 || true'
          docker info --format 'docker {{.ServerVersion}}, security options: {{json .SecurityOptions}}'
      - name: Build the probe image
        run: |
          docker build -t sandbox-probe --build-arg "SRT=${SANDBOX_RUNTIME_VERSION}" - <<'EOF'
          FROM node:22-bookworm-slim
          ARG SRT
          RUN apt-get update \
              && apt-get install -y --no-install-recommends bubblewrap socat ripgrep curl ca-certificates \
              && rm -rf /var/lib/apt/lists/* \
              && npm install -g "@anthropic-ai/sandbox-runtime@${SRT}"
          USER node
          EOF
      - name: Docker defaults refuse the sandbox
        run: |
          docker run --rm -v "$PWD/tests/sandbox-probe.sh:/probe.sh:ro" \
            sandbox-probe bash /probe.sh blocked
      # Colima's Ubuntu 24.04 image ships kernel.apparmor_restrict_unprivileged_userns=1,
      # which leaves bubblewrap's namespaces without capabilities whatever the
      # container's options. Report what the VM as shipped does, pass or fail.
      - name: "Report: the template's runArgs on the VM as shipped"
        run: |
          if docker run --rm \
              --security-opt "seccomp=$PWD/{{cookiecutter.project_slug}}/.devcontainer/seccomp-sandbox.json" \
              --security-opt apparmor=unconfined \
              -v "$PWD/tests/sandbox-probe.sh:/probe.sh:ro" \
              sandbox-probe bash /probe.sh works; then
            echo "::notice::The sandbox works on this Colima VM without the userns sysctl"
          else
            echo "::notice::The sandbox needs the VM's userns sysctl on this Colima VM"
          fi
      # The one-time host fix DEVCONTAINER.md documents and post-create.sh
      # prints, VERBATIM, then a VM restart to prove it persists.
      - name: Apply the documented VM fix and restart Colima
        run: |
          colima ssh -- sudo sh -c 'echo kernel.apparmor_restrict_unprivileged_userns=0 > /etc/sysctl.d/99-bash-sandbox.conf && sysctl -p /etc/sysctl.d/99-bash-sandbox.conf'
          colima stop
          colima start
          test "$(colima ssh -- sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
      - name: The template's runArgs let the sandbox work
        run: |
          # The same two options the generated devcontainer.json passes.
          docker run --rm \
            --security-opt "seccomp=$PWD/{{cookiecutter.project_slug}}/.devcontainer/seccomp-sandbox.json" \
            --security-opt apparmor=unconfined \
            -v "$PWD/tests/sandbox-probe.sh:/probe.sh:ro" \
            sandbox-probe bash /probe.sh works
      # The VM fix must not open user namespaces to containers in general:
      # everything else on the VM still runs under Docker's defaults.
      - name: Docker defaults still refuse the sandbox after the VM fix
        run: |
          docker run --rm -v "$PWD/tests/sandbox-probe.sh:/probe.sh:ro" \
            sandbox-probe bash /probe.sh blocked
      # Informational: whether this VM needs apparmor=unconfined at all.
      - name: "Diagnostic: seccomp profile alone"
        continue-on-error: true
        run: |
          docker run --rm \
            --security-opt "seccomp=$PWD/{{cookiecutter.project_slug}}/.devcontainer/seccomp-sandbox.json" \
            -v "$PWD/tests/sandbox-probe.sh:/probe.sh:ro" \
            sandbox-probe bash /probe.sh works

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
