name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  guard-git-tests:
    name: git safety layer regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Table-tests the ACTUAL hooks with real PreToolUse JSON payloads:
      # wrapper-token bypasses, clean/push force forms, cd/-C/--git-dir
      # target resolution, fail-closed behavior, the recovery whitelist,
      # false positives, jq-missing handling, and merge-hooks.jq
      # idempotency. Needs only bash, jq, git.
      - name: Run guard-git table tests
        run: bash tests/guard-git-tests.sh

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned docker form: the linter version is explicit, not whatever a
      # marketplace action resolves to.
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          shellcheck --severity=info \
            .devcontainer/post-create.sh \
            .devcontainer/init-host-certs.sh \
            .devcontainer/config/bin/snaps \
            .devcontainer/config/claude/hooks/*.sh \
            tests/guard-git-tests.sh

  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: .devcontainer/Dockerfile

  devcontainer-build:
    name: devcontainer build smoke test
    runs-on: ubuntu-latest
    # devcontainer.json passes this through to containerEnv, so the
    # post-create run inside the build skips the 11 plugin-install network
    # calls that need a signed-in CLI and are doomed in CI anyway.
    env:
      KOKKO_SKIP_PLUGINS: "1"
    steps:
      - uses: actions/checkout@v4
      # Builds the image and runs postCreateCommand — this is what catches a
      # Dockerfile or post-create.sh regression before a human hits it.
      # Requires .devcontainer/certs/.gitkeep to be committed so the COPY
      # succeeds on a fresh clone.
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -e
            jq --version
            command -v snaps
            command -v claude   # baked into the image by the Dockerfile
            test -x "$HOME/.claude/hooks/guard-git.sh"
            test -f "$HOME/.claude/hooks/lib-git-target.sh"
            # Hooks present on disk is not enough — verify they are WIRED
            # into the live settings.json the merge produced.
            jq -e '[.hooks.PreToolUse[].hooks[].command] | map(test("guard-git\\.sh")) | any' "$HOME/.claude/settings.json"
            jq -e '[.hooks.PreToolUse[].hooks[].command] | map(test("git-snapshot\\.sh")) | any' "$HOME/.claude/settings.json"
            jq -e '[.hooks.UserPromptSubmit[].hooks[].command] | map(test("git-snapshot\\.sh")) | any' "$HOME/.claude/settings.json"
            jq -e '[.hooks.SessionStart[].hooks[].command] | map(test("session-git-safety\\.sh")) | any' "$HOME/.claude/settings.json"
            # Idempotence smoke: a second --config-only run must succeed.
            KOKKO_SKIP_PLUGINS=1 bash .devcontainer/post-create.sh --config-only

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
